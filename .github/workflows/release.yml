name: Release macOS app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    env:
      TINYJS_VERSION: v0.60.0

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve and verify tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          VERSION=$(node -p "require('./tinyjs.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match tinyjs.json version v$VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install tinyjs
        run: |
          curl -fsSL https://tinyjs.app/install | sh
          echo "$HOME/.tinyjs" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npm run lint

      - name: Build universal app
        run: tinyjs build --universal

      - name: Package app
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          APP="dist/Toolsmith Editor Desktop.app"
          ASSET="Toolsmith-Editor-Desktop-${TAG}-macos-universal.zip"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ASSET"
          shasum -a 256 "$ASSET" > SHA256SUMS.txt
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS.txt
        id: package

      - name: Generate release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          SHA=$(awk '{print $1}' SHA256SUMS.txt)
          sed -e "s/@@TAG@@/$TAG/g" \
              -e "s/@@ASSET@@/$ASSET/g" \
              -e "s/@@SHA256@@/$SHA/g" \
              .github/release-notes.md > release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-${{ steps.version.outputs.tag }}
          path: |
            ${{ steps.package.outputs.asset }}
            SHA256SUMS.txt
            release-notes.md
          retention-days: 14

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          TITLE="Toolsmith Editor Desktop $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
          else
            gh release create "$TAG" "$ASSET" SHA256SUMS.txt \
              --title "$TITLE" --notes-file release-notes.md
          fi
